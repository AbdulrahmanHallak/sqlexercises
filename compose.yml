services:
  sqlexercises:
    image: sqlexercises
    container_name: sqlexercises-razor
    build:
      context: ./src/
      dockerfile: Dockerfile
      args:
        UID: ${UID}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

    ports:
      - 8080:8080

    networks:
      - sqlexercises
    volumes:
      - ${HOME}/.aspnet/DataProtection-Keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      - pgbouncer

  db:
    image: postgres:15-alpine
    container_name: sqlexercises-db
    ports:
      - 3030:5432
    volumes:
      - sqlexercises-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=sqlexercises
      - POSTGRES_PASSWORD=tls123dks
      - POSTGRES_USER=postgres
    networks:
      - sqlexercises
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sqlexercises-pgbouncer
    volumes:
      - ${HOME}/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ${HOME}/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sqlexercises
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]

  seq:
    image: datalust/seq:latest
    container_name: sqlexercises-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin
    ports:
      - 5341:80
    volumes:
      - seq-data:/data
    networks:
      - sqlexercises

networks:
  sqlexercises:
    name: sqlexercises-network
    driver: bridge

volumes:
  sqlexercises-data:
    name: sqlexercises-data
  seq-data:
    name: seq-data
