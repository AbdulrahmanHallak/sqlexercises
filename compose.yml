services:
  sqlexercises:
    image: sqlexercises
    container_name: sqlexercises-razor
    build:
      context: .
      dockerfile: ./src/Dockerfile
      args:
        UID: ${UID}

    ports:
      - 8080:8080

    networks:
      - sqlexercises
    volumes:
      - ${HOME}/.aspnet/DataProtection-Keys:/home/app/.aspnet/DataProtection-Keys

  db:
    image: postgres:15-alpine
    container_name: sqlexercises-db
    ports:
      - 3030:5432
    volumes:
      - sqlexercises-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=sqlexercises
      - POSTGRES_PASSWORD=tls123dks
    networks:
      - sqlexercises

  seq:
    image: datalust/seq:latest
    container_name: sqlexercises-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=admin
    ports:
      - 5341:80
    volumes:
      - seq-data:/data
    networks:
      - sqlexercises

networks:
  sqlexercises:
    name: sqlexercises-network
    driver: bridge

volumes:
  sqlexercises-data:
    name: sqlexercises-data
  seq-data:
    name: seq-data
